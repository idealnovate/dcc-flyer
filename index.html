<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get your Digital Clinic Conference flyer</title>
<meta name="description" content="Add your photo and name to get your Digital Clinic Conference flyer.">
<meta property="og:title" content="Get your Digital Clinic Conference flyer">
<meta property="og:description" content="Add your photo and name, download your flyer, and let your network know you'll be attending.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dcc-flyer.vercel.app/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0aa48c;
  --bg-deep: #0a9d81;
  --paper: #f7f6f2;
  --paper-dim: #efece8;
  --ink: #101e2d;
  --muted: #5d6473;
  --line: #d9d3c9;
  --teal: #1db9a0;
  --teal-deep: #0b8f77;
  --navy: #0d223a;
  --navy-soft: #1d2c45;
  --gold: #f3be34;
  --gold-strong: #f0b529;
  --white: #ffffff;
  --shadow: rgba(10,20,30,0.12);
  --font: "Montserrat", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 18px;
}
.app {
  width: min(1280px, 100%);
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(280px, 420px);
  gap: 28px;
  align-items: center;
}
.stage {
  display: flex;
  justify-content: center;
  align-items: center;
}
canvas {
  display: block;
  width: min(82vw, 820px);
  max-width: 100%;
  height: auto;
  background: #ddd;
  box-shadow: 0 32px 38px -18px rgba(0,0,0,0.18);
  border-radius: 4px;
}
canvas.can-drag { cursor: grab; }
canvas.dragging { cursor: grabbing; }
.panel {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  padding: 22px 20px;
  backdrop-filter: blur(2px);
}
.step {
  padding: 6px 0 18px;
}
.step + .step {
  border-top: 1px solid rgba(255,255,255,0.18);
  padding-top: 18px;
}
.step h2 {
  margin: 0 0 12px;
  color: white;
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}
.step h2 span {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  background: var(--gold);
  color: var(--ink);
  font-size: 0.8rem;
}
.upload {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  border: 2px dashed rgba(255,255,255,0.35);
  border-radius: 14px;
  padding: 16px;
  background: rgba(255,255,255,0.06);
  cursor: pointer;
  color: white;
}
.upload:hover, .upload:focus-within { border-color: rgba(255,255,255,0.7); }
.upload input { position: absolute; left: -9999px; }
.thumb {
  width: 56px; height: 56px; border-radius: 12px; background: var(--gold) center/cover no-repeat; flex: none;
}
.upload strong { display: block; font-size: 1rem; }
.upload small { color: rgba(255,255,255,0.8); display: block; margin-top: 4px; }
label.f {
  display: block;
  margin: 0 0 8px;
  color: white;
  font-size: 0.9rem;
  font-weight: 600;
}
input[type=text] {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: white;
  padding: 12px 14px;
  font: 600 1rem var(--font);
}
input[type=text]::placeholder { color: rgba(255,255,255,0.58); }
input[type=text]:focus { outline: 2px solid rgba(255,255,255,0.7); outline-offset: 1px; }
.adj { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; margin-top: 12px; color: white; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.btn {
  border: 0; border-radius: 12px; padding: 14px 18px; font: 700 1rem var(--font); cursor: pointer;
}
.btn.primary { background: var(--gold); color: var(--ink); flex: 1; }
.btn.ghost {
  background: transparent; color: white; border: 1px solid rgba(255,255,255,0.25); padding: 10px 14px; font-weight: 600;
}
.btn:disabled { cursor: not-allowed; opacity: .45; }
.msg { margin-top: 10px; min-height: 1.4em; font-size: 0.9rem; color: white; }
.msg.err { color: #ffd5d1; }
.result { display: none; margin-top: 16px; }
.result.show { display: block; }
.result img { width: 100%; border-radius: 12px; display: block; }
.result p { margin: 8px 0 0; color: rgba(255,255,255,0.8); font-size: .9rem; }
@media (max-width: 940px) {
  .app { grid-template-columns: 1fr; }
  .panel { order: 2; }
  .stage { order: 1; }
  canvas { width: min(92vw, 760px); }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv" width="1080" height="1350" aria-label="Digital Clinic Conference flyer preview"></canvas>
  </div>

  <aside class="panel">
    <section class="step">
      <h2><span>1</span>Add your photo</h2>
      <label class="upload">
        <div class="thumb" id="thumb"></div>
        <div>
          <strong id="upTitle">Choose a photo</strong>
          <small>JPG or PNG. Use a clear, front-facing photo.</small>
        </div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp">
      </label>
      <div id="adjust" hidden>
        <div class="adj"><label for="zoom">Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
        <div class="adj"><label for="rot">Rotate</label><input type="range" id="rot" min="-180" max="180" step="1" value="0"></div>
        <div class="row"><button type="button" class="btn ghost" id="reset">Reset position</button></div>
      </div>
      <p class="msg err" id="fileErr" role="alert"></p>
    </section>

    <section class="step">
      <h2><span>2</span>Add your name</h2>
      <label class="f" for="name">Full name</label>
      <input type="text" id="name" maxlength="36" placeholder="e.g. Ada Okafor" autocomplete="name">
    </section>

    <section class="step">
      <button type="button" class="btn primary" id="dl" disabled style="width:100%">Download flyer</button>
      <p class="msg" id="dlMsg" role="status"></p>
      <div class="result" id="result">
        <img id="resultImg" alt="Your finished flyer">
        <p>Press and hold the image (or right-click it) and choose save.</p>
      </div>
    </section>
  </aside>
</div>

<script>
const W = 1080, H = 1350;
const BASE_SRC = "template.jpg";
const FRAME = [[342,442],[740,435],[740,829],[342,829]];
const BOX = { x:342, y:435, w:398, h:394 };
const NAME = { cx:540, cy:880, maxW:370, size:30, minSize:18, lineGap:1.0, color:"#FFFFFF", placeholder:"Your Name" };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const state = { img:null, ox:0, oy:0, zoom:1, rot:0, name:"" };
const base = new Image(); let baseReady = false;
base.onload = () => { baseReady = true; render(); };
base.src = BASE_SRC;

function clipFrame(){
  ctx.beginPath();
  FRAME.forEach(([x,y],i)=> i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
}

function nameLines(text){
  for (let s = NAME.size; s >= NAME.minSize; s -= 1){
    ctx.font = `700 ${s}px "Montserrat", sans-serif`;
    if (ctx.measureText(text).width <= NAME.maxW){
      return { s, lines:[text] };
    }
    const words = text.split(/\s+/);
    if (words.length > 1){
      let best = null;
      for (let i = 1; i < words.length; i++){
        const a = words.slice(0, i).join(" ");
        const b = words.slice(i).join(" ");
        const w = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (!best || w < best.w) best = { w, lines:[a,b] };
      }
      if (best && best.w <= NAME.maxW) return { s, lines:best.lines };
    }
  }
  ctx.font = `700 ${NAME.minSize}px "Montserrat", sans-serif`;
  return { s:NAME.minSize, lines:[text] };
}

function render(){
  ctx.clearRect(0,0,W,H);
  if (baseReady) ctx.drawImage(base,0,0,W,H);
  if (state.img){
    const i = state.img, sc = Math.max(BOX.w / i.width, BOX.h / i.height);
    ctx.save();
    clipFrame();
    ctx.clip();
    ctx.translate(BOX.x + BOX.w/2 + state.ox, BOX.y + BOX.h/2 + state.oy);
    ctx.rotate(state.rot * Math.PI / 180);
    ctx.scale(sc * state.zoom, sc * state.zoom);
    ctx.drawImage(i, -i.width/2, -i.height/2);
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle = "rgba(16,23,42,.45)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '600 26px "Montserrat", sans-serif';
    ctx.fillText("Your photo here", BOX.x + BOX.w/2, BOX.y + BOX.h/2);
    ctx.restore();
  }

  const txt = state.name.trim().replace(/\s+/g," ") || NAME.placeholder;
  const { s, lines } = nameLines(txt);
  ctx.save();
  ctx.fillStyle = NAME.color;
  ctx.globalAlpha = state.name.trim() ? 1 : .45;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `700 ${s}px "Montserrat", sans-serif`;
  const lh = s * NAME.lineGap;
  const top = NAME.cy - (lines.length - 1) * lh / 2;
  lines.forEach((line, k) => ctx.fillText(line, NAME.cx, top + k * lh));
  ctx.restore();

  document.getElementById("dl").disabled = !(state.img && state.name.trim());
  document.getElementById("result").classList.remove("show");
}

const fileErr = document.getElementById("fileErr");
const fileInput = document.getElementById("file");
fileInput.addEventListener("change", e => {
  const f = e.target.files[0];
  fileErr.textContent = "";
  if (!f) return;
  if (!/^image\/(png|jpe?g|webp)$/.test(f.type)){ fileErr.textContent = "That file type isn't supported. Choose a JPG or PNG photo."; return; }

  const url = URL.createObjectURL(f), i = new Image();
  i.onload = () => {
    state.img = i;
    state.ox = state.oy = 0;
    state.zoom = 1;
    state.rot = 0;
    document.getElementById("zoom").value = 1;
    document.getElementById("rot").value = 0;
    document.getElementById("adjust").hidden = false;
    document.getElementById("thumb").style.backgroundImage = `url(${url})`;
    document.getElementById("upTitle").textContent = "Change photo";
    cv.classList.add("can-drag");
    render();
  };
  i.onerror = () => { fileErr.textContent = "This photo couldn't be opened. Try a different JPG or PNG."; };
  i.src = url;
});

document.getElementById("zoom").addEventListener("input", e => { state.zoom = +e.target.value; render(); });
document.getElementById("rot").addEventListener("input", e => { state.rot = +e.target.value; render(); });
document.getElementById("reset").addEventListener("click", () => {
  state.ox = state.oy = 0;
  state.zoom = 1;
  state.rot = 0;
  document.getElementById("zoom").value = 1;
  document.getElementById("rot").value = 0;
  render();
});

let drag = null;
function toCanvas(ev){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height };
}

cv.addEventListener("pointerdown", ev => {
  if (!state.img) return;
  const p = toCanvas(ev);
  drag = { x:p.x, y:p.y, ox:state.ox, oy:state.oy };
  cv.setPointerCapture(ev.pointerId);
  cv.classList.add("dragging");
});

cv.addEventListener("pointermove", ev => {
  if (!drag) return;
  const p = toCanvas(ev);
  const lim = BOX.w * state.zoom;
  state.ox = Math.max(-lim, Math.min(lim, drag.ox + p.x - drag.x));
  state.oy = Math.max(-lim, Math.min(lim, drag.oy + p.y - drag.y));
  render();
});

["pointerup","pointercancel"].forEach(t => cv.addEventListener(t, () => { drag = null; cv.classList.remove("dragging"); }));

cv.addEventListener("wheel", ev => {
  if (!state.img) return;
  ev.preventDefault();
  state.zoom = Math.max(1, Math.min(3, state.zoom - ev.deltaY * 0.0015));
  document.getElementById("zoom").value = state.zoom;
  render();
}, { passive:false });

document.getElementById("name").addEventListener("input", e => { state.name = e.target.value; render(); });

const dlMsg = document.getElementById("dlMsg");
function showResult(url){
  document.getElementById("resultImg").src = url;
  document.getElementById("result").classList.add("show");
}

document.getElementById("dl").addEventListener("click", () => {
  dlMsg.className = "msg"; dlMsg.textContent = "";
  const slug = state.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "attendee";
  const filename = `dcc-${slug}.jpg`;
  cv.toBlob(async blob => {
    if (!blob){ dlMsg.className = "msg err"; dlMsg.textContent = "The flyer couldn't be created. Try again."; return; }
    const url = URL.createObjectURL(blob);
    showResult(url);
    const file = new File([blob], filename, { type:"image/jpeg" });
    const touch = matchMedia("(pointer: coarse)").matches;
    if (touch && navigator.canShare && navigator.canShare({ files:[file] })){
      try {
        await navigator.share({ files:[file], title:"Digital Clinic Conference" });
        dlMsg.textContent = "Flyer ready.";
        return;
      } catch (err) {
        if (err && err.name === "AbortError") {
          dlMsg.textContent = "You can still save the flyer below.";
          return;
        }
      }
    }
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    dlMsg.textContent = "Flyer downloaded. If nothing saved, use the image below.";
  }, "image/jpeg", 0.95);
});

render();
document.fonts.load('700 30px "Montserrat"').then(render).catch(()=>{});
</script>
</body>
</html>
